<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삼다수 증권 데일리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="매일 아침 미국 종가 기준 시장 요약: 추세 규칙, 캔들 차트, 섹터, 공매도, 뉴스, 실적, 시뮬레이션">
<meta name="theme-color" content="#17222B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="삼다수 증권">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손으로 넘겨 보는 세로 한 줄 앱. 위에 고정 헤더+탭, 아래로 요약 → 근거 순서. 색: 제주 현무암(잉크) + 바다색(포인트), 한국식 상승=빨강·하락=파랑 */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --sunk:#E4EAEC; --ink:#17222B; --muted:#5C6A74; --line:#D5DDE1;
  --accent:#0B7A84; --accent-soft:rgba(11,122,132,.14);
  --up:#D2343B; --up-soft:rgba(210,52,59,.13); --down:#1E5CC8; --down-soft:rgba(30,92,200,.13);
  --warn:#B86E00; --warn-soft:rgba(184,110,0,.13); --ok:#1B8A55;
  --tl-up:var(--ink); --tl-down:#B4207A; --node:#7E57C2;
  --ma5:#E8743B; --ma20:#C9A100; --ma60:#2E9E5B; --ma120:#7A55C9; --ma200:#8B5E3C; --ma240:#6F7C86;
  --rose-shell:#DFE5E8; --rose-up:#F2B3B6; --rose-down:#B3C8F0; --rose-on:#17222B;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1317; --surface:#151D23; --sunk:#1C262D; --ink:#E4EBEE; --muted:#93A1AA; --line:#26333B;
  --accent:#43B9C2; --accent-soft:rgba(67,185,194,.16);
  --up:#FF5E63; --up-soft:rgba(255,94,99,.16); --down:#5E92F6; --down-soft:rgba(94,146,246,.17);
  --warn:#E7A23D; --warn-soft:rgba(231,162,61,.16); --ok:#41C281;
  --tl-down:#F06AB8; --node:#A98BF0;
  --ma5:#F59A62; --ma20:#E8C547; --ma60:#4FCB82; --ma120:#A98BF0; --ma200:#C49C82; --ma240:#A3B0BA;
  --rose-shell:#27333B; --rose-up:#F6C2C4; --rose-down:#C3D3F6; --rose-on:#17222B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#151D23; --sunk:#1C262D; --ink:#E4EBEE; --muted:#93A1AA; --line:#26333B;
  --accent:#43B9C2; --accent-soft:rgba(67,185,194,.16);
  --up:#FF5E63; --up-soft:rgba(255,94,99,.16); --down:#5E92F6; --down-soft:rgba(94,146,246,.17);
  --warn:#E7A23D; --warn-soft:rgba(231,162,61,.16); --ok:#41C281;
  --tl-down:#F06AB8; --node:#A98BF0;
  --ma5:#F59A62; --ma20:#E8C547; --ma60:#4FCB82; --ma120:#A98BF0; --ma200:#C49C82; --ma240:#A3B0BA;
  --rose-shell:#27333B; --rose-up:#F6C2C4; --rose-down:#C3D3F6; --rose-on:#17222B; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .warn{color:var(--warn)}
a{color:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 4px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand b{color:var(--accent)}
.asof{font-size:12.5px;color:var(--muted);text-align:right}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px 8px}
nav::-webkit-scrollbar{display:none}
nav button,.seg button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:6px 13px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;font-size:13px;padding:5px 8px;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
section.tab{display:grid;gap:14px}
.card{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px;text-wrap:balance}
.card h2 small{font-size:12px;font-weight:500;color:var(--muted);text-align:right}
.sub{font-size:13px;font-weight:600;margin:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.up{background:var(--up-soft)} .chip.down{background:var(--down-soft)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.plain{background:var(--sunk);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* 오늘 */
.hero{background:var(--ink);color:var(--surface);border-radius:20px;padding:18px;display:grid;gap:14px}
.hero .lbl{font-size:12.5px;opacity:.72;letter-spacing:.02em}
.hero .state{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.hero .state span{font-size:16px;font-weight:600;opacity:.75;margin-left:6px}
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quote{background:rgba(127,140,150,.16);border-radius:12px;padding:10px 12px;min-width:0}
.quote .t{font-size:12px;opacity:.75;font-weight:600}
.quote .p{font-size:22px;font-weight:600}
.quote .c{font-size:13px;font-weight:600}
.hero .c.up{color:#FF7A7E} .hero .c.down{color:#7FA8FF}
.check{display:grid;gap:8px}
.check .row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;font-size:14px}
.check .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.mk.y{background:var(--ok);color:var(--surface)} .mk.n{background:var(--sunk);color:var(--muted);border:1.5px dashed var(--muted)}
.check .v{font-size:13px;color:var(--muted);text-align:right}
.callout{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.callout.w{background:var(--warn-soft)}
.gtrack{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok) 0 45%,var(--warn) 45% 62.5%,var(--up) 62.5% 100%);opacity:.85}
.gpin{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-2px);box-shadow:0 0 0 2px var(--surface)}
.gscale{position:relative;height:14px;font-size:11px;color:var(--muted)}
.gscale span{position:absolute;transform:translateX(-50%)} .gscale span:first-child{transform:none} .gscale span:last-child{transform:none;right:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans);fill:var(--muted)}

/* 캔들 차트 */
.cinfo{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted);min-height:58px;align-content:flex-start}
.cinfo b{color:var(--ink);font-weight:600}
.cwrap{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles button{font:inherit;font-size:12px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.toggles button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.toggles i{display:inline-block;width:12px;height:3px;border-radius:2px}
.tl{display:grid;gap:6px;font-size:13px}
.tl div{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:baseline}
.tl i{display:inline-block;width:14px;height:0;border-top:2.5px dashed;transform:translateY(-3px)}

/* 버터플라이 막대 */
.bf{display:grid;gap:6px}
.bf .hd,.bf .r{display:grid;grid-template-columns:48px 1fr 1fr;gap:0 6px;align-items:center}
.bf .hd{font-size:11.5px;color:var(--muted)} .bf .hd span:nth-child(2){text-align:right}
.bf .r>span:first-child{font-size:13px;font-weight:600}
.bf .l,.bf .rt{height:22px;background:var(--sunk);display:flex}
.bf .l{justify-content:flex-end;border-radius:4px 0 0 4px} .bf .rt{border-radius:0 4px 4px 0}
.bf .l i,.bf .rt i{display:flex;align-items:center;height:100%;font-style:normal;font-size:12px;font-weight:600;font-family:var(--mono);padding:0 6px;border-radius:inherit;color:#fff}
.bf .l i{background:var(--up);justify-content:flex-start}
.bf .rt i{background:var(--down);justify-content:flex-end}
.bf .r.win-dn .l i{opacity:.55} .bf .r.win-up .rt i{opacity:.55}
.bf .l,.bf .rt{position:relative} .bf .r.cm .l i{justify-content:flex-end} .bf .r.cm .rt i{justify-content:flex-start} .bf .r>span:first-child small{display:block;font-size:10px;font-weight:500;color:var(--muted);line-height:1.1}
.bf .tk{position:absolute;top:-3px;bottom:-3px;width:2px;margin:0 -1px;background:var(--ink);opacity:.8;border-radius:1px}

/* 섹터 */
.sec{display:grid;gap:7px}
.sec .r{display:grid;grid-template-columns:minmax(0,96px) 1fr 58px;gap:8px;align-items:center;font-size:13px}
.sec .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .nm small{color:var(--muted);font-family:var(--mono);font-size:10.5px;margin-left:3px}
.sec .tr{position:relative;height:16px}
.sec .tr::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.sec .tr i{position:absolute;top:2px;height:12px;border-radius:3px;transition:width .2s cubic-bezier(.23,1,.32,1)}
.sec .val{text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap}
.sec .tag{font-size:10.5px;font-weight:700;margin-left:3px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px;vertical-align:middle}

/* 기간별 지표 */
.mp{display:grid}
.mp .r{display:grid;grid-template-columns:minmax(0,1fr) 88px 84px;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.mp .r:first-child{border-top:0;padding-top:2px}
.mp .nm{font-size:13.5px;font-weight:600;min-width:0}
.mp .nm .v{display:block;font-size:18px;font-weight:600}
.mp .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.mp .ch{text-align:right;font-size:13px;font-weight:600;white-space:nowrap}
.mp .ch small{display:block;font-size:11px;color:var(--muted);font-weight:400;white-space:normal;font-family:var(--sans)}
.mp .sp{font-size:11px;color:var(--muted);text-align:center}
.mp svg{height:32px}

/* 이벤트 (Polymarket) */
.evc{display:grid;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.evc:first-child{border-top:0;padding-top:4px}
.evc .et{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.evc .et a{font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;line-height:1.4}
.evc .et small{grid-column:1/-1;font-size:12px;color:var(--muted)}
.evc .et .en{font-size:12px;color:var(--muted);font-weight:400;display:block}
.mk{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:3px 10px;align-items:center}
.mk .ml{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.mk .mpr{font-size:16px;font-weight:600;text-align:right}
.mk .mb{grid-column:1/-1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.mk .mb i{display:block;height:100%;background:var(--accent)}
.mk .mv{grid-column:1/-1;font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mk .mv .chip{font-size:11px;padding:1px 7px}
.mks{display:grid;gap:9px}
details.more>summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);padding-top:2px}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{color:var(--muted)}
.bop{display:grid;gap:12px}
.bop .row{display:grid;gap:5px}
.bop .hd{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.bop .pb{display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:12.5px;font-weight:700;color:#fff;font-family:var(--mono)}
.bop .pb span{display:flex;align-items:center;padding:0 8px;white-space:nowrap}
.bop .d{background:#2F6BD8;justify-content:flex-start} .bop .r{background:#D23B3B;justify-content:flex-end}
.bop .o{background:#7C8A94} .bop .u{background:var(--sunk);color:var(--muted)}
.bop small{font-size:11.5px;color:var(--muted)}

/* 목록 */
.list{display:grid}
.list>.it{display:grid;gap:4px;padding-block:11px;border-top:1px solid var(--line)}
.list>.it:first-child{border-top:0;padding-top:2px}
details.ev{border-top:1px solid var(--line)}
details.ev:first-child{border-top:0}
details.ev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;padding-block:11px}
details.ev summary::-webkit-details-marker{display:none}
details.ev .stars{font-size:11px;letter-spacing:-1px;color:var(--warn);white-space:nowrap}
details.ev .ttl{font-size:14px;font-weight:500}
details.ev .meta{grid-column:2;font-size:12px;color:var(--muted)}
details.ev .more{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}
details.ev[open] .more{color:var(--muted)}
details.ev .heads{display:grid;gap:8px;padding:0 0 12px 12px;border-left:2px solid var(--accent-soft);margin-left:4px}
.heads a{display:grid;gap:1px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.45}
.heads a small{color:var(--muted);font-size:11.5px}
.heads a span.k{color:var(--muted);font-size:12.5px}
.heads a:hover b,.heads a:active b{text-decoration:underline}
.heads b{font-weight:500}
.pm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.pm .tk{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pm .pr{font-size:22px;font-weight:600;text-align:right;grid-row:span 2;text-decoration:none}
.pm .q{font-size:12.5px;color:var(--muted)}
.pm .pbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.pm .pbar i{display:block;height:100%;background:var(--accent)}
.pm .vol{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pm .vol b{color:var(--ink)}
.day{display:grid;grid-template-columns:58px 1fr;gap:10px;padding-block:9px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font-weight:700;font-size:14px} .day .d small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--sunk);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)} .tile .v{font-size:19px;font-weight:600} .tile .s{font-size:12px}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--muted);font-weight:600}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child,td.t{font-family:var(--sans);font-weight:600}
td.t{font-weight:500;font-size:12.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
/* 차트·뉴스 점수 한눈에 (꽃잎 차트): 왼쪽 반 = 차트 분석, 오른쪽 반 = 뉴스 분석, 위 = 오름, 아래 = 내림 */
.rose{display:grid;gap:10px}
.rose svg{display:block;width:100%;max-width:360px;height:auto;margin:0 auto;overflow:visible}
.rose .sh{fill:var(--rose-shell);stroke:var(--rose-shell);stroke-linejoin:round}
.rose .pu{fill:var(--rose-up);stroke:var(--rose-up);stroke-linejoin:round}
.rose .pd{fill:var(--rose-down);stroke:var(--rose-down);stroke-linejoin:round}
.rose text{font-family:var(--sans);text-anchor:middle;fill:var(--ink)}
.rose text.on{fill:var(--rose-on)}
.rose .n{font-family:var(--mono);font-weight:600;font-size:21px;letter-spacing:-.02em}
.rose .k{font-size:10.5px;font-weight:600}
.rose .side{font-size:13px;font-weight:700}
.rose .sn{font-size:10.5px;fill:var(--muted)}
.rose .ax{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.rv{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.rv .h{font-size:11.5px;color:var(--muted)}
.rv .tk{font-weight:700}
.rv .ag{font-size:12px;text-align:right}
.rgo{display:flex;gap:8px}
.rgo button{flex:1;font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:10px;padding:8px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){section.tab{animation:fade .2s cubic-bezier(.23,1,.32,1)}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <div class="brand">삼다수 <b>증권</b></div>
      <div class="asof" id="asof">불러오는 중</div>
    </div>
    <nav role="tablist" aria-label="화면">
      <button role="tab" id="t-today" data-tab="today" aria-selected="true">오늘</button>
      <button role="tab" id="t-chart" data-tab="chart" aria-selected="false">차트</button>
      <button role="tab" id="t-market" data-tab="market" aria-selected="false">시장</button>
      <button role="tab" id="t-events" data-tab="events" aria-selected="false">이벤트</button>
      <button role="tab" id="t-news" data-tab="news" aria-selected="false">뉴스</button>
      <button role="tab" id="t-cal" data-tab="cal" aria-selected="false">일정</button>
      <button role="tab" id="t-sim" data-tab="sim" aria-selected="false">전망</button>
    </nav>
  </div>
</header>

<main id="main"><div class="loading" id="loading">오늘 자료를 불러오는 중이에요</div></main>

<script>
const HZ={d1:'하루',w1:'1주',m1:'1달',m3:'3개월',m6:'6개월',y1:'1년'};
const PER={d1:'1일',w1:'1주',m1:'1달',m3:'3개월',m6:'6개월',y1:'1년'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sgn=(v,d=1)=>v==null?'–':(v>0?'+':v<0?'−':'')+Math.abs(v*100).toFixed(d)+'%';
const pc0=v=>v==null?'–':Math.round(v*100)+'%';
const cls=v=>v==null?'':v>0?'up':v<0?'down':'';
const minus=s=>String(s).replace(/(^|[\s(])-(?=\d|\$)/g,'$1−');
const md=d=>{const [y,m,dd]=d.split('-');return `${+m}/${+dd}`};
const WD='일월화수목금토';
const wday=d=>WD[new Date(d+'T12:00:00Z').getUTCDay()];
function nice(span){const p=Math.pow(10,Math.floor(Math.log10(span)));const f=span/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function seg(opts,cur,attr){return `<div class="seg" role="group">${opts.map(([k,l])=>`<button type="button" ${attr}="${k}" aria-pressed="${k===cur}">${l}</button>`).join('')}</div>`}

fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(e=>{
  $('loading').textContent='자료를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요. ('+e.message+')';
});

function render(D){
  const S=D.status;
  $('asof').innerHTML=`<span class="num">${md(D.date)}(${wday(D.date)})</span> 미국 종가 기준<br>${md(D.generated_at.slice(0,10))} <span class="num">${D.generated_at.slice(11)}</span> 갱신`;
  $('main').innerHTML=[todayTab(D),chartTab(D),marketTab(D),eventsTab(D),newsTab(D),calTab(D),simTab(D)].join('');
  // 탭
  const tabs=[...document.querySelectorAll('nav button')];
  const show=name=>{tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===name?'true':'false'));
    document.querySelectorAll('section.tab').forEach(s=>s.hidden=s.id!==name);store('sd-tab',name);window.scrollTo({top:0})};
  tabs.forEach(b=>b.onclick=()=>show(b.dataset.tab));
  const saved=store('sd-tab'); show(saved&&$(saved)?saved:'today');
  paperChart(D.paper); mountRose(D);
  ['QQQ','TQQQ'].forEach(k=>mountChart(k,D.charts[k],k==='QQQ'?S:null));
  mountSectors(D.sectors); mountShort(D.short); mountMacro(D.macro_periods); mountEvents(D.pm_events);
}

/* ---------------- 오늘 ---------------- */
function todayTab(D){
  const S=D.status,R=S.risk;
  const met=S.conds.filter(c=>c.met).length;
  const lvl={낮음:'acc',보통:'warn',높음:'up'}[R.level]||'plain';
  const pin=Math.min(100,R.vol20/0.40*100);
  return `<section class="tab" id="today">
  <div class="hero">
    <div><div class="lbl">추세 규칙 상태</div>
    <div class="state">${S.base_on?'보유':'현금'}<span>TQQQ 목표 ${S.base_on?'50':'0'}%</span></div></div>
    <div class="quotes">
      <div class="quote"><div class="t">QQQ</div><div class="p num">$${S.px.toFixed(2)}</div><div class="c ${cls(S.chg)} num">${S.chg<0?'▼':'▲'} ${Math.abs(S.chg*100).toFixed(2)}%</div></div>
      <div class="quote"><div class="t">TQQQ</div><div class="p num">$${S.tq_px.toFixed(2)}</div><div class="c ${cls(S.tq_chg)} num">${S.tq_chg<0?'▼':'▲'} ${Math.abs(S.tq_chg*100).toFixed(2)}%</div></div>
    </div>
  </div>
  ${roseCard(D)}
  <div class="card">
    <h2>${S.cond_title} <small>${S.conds.length}개 중 ${met}개 충족</small></h2>
    <div class="check">${S.conds.map(c=>`<div class="row"><span class="mk ${c.met?'y':'n'}">${c.met?'✓':'✕'}</span><span>${esc(c.text)}</span><span class="v num">${esc(c.value)}</span></div>`).join('')}</div>
    ${S.need.length?`<div class="callout">${S.need.map(esc).join('<br>')}</div>`:''}
    <p class="note">QQQ 200일선 $${S.sma200.toFixed(2)} · ${S.cloud} (구름 $${S.cloud_bot.toFixed(0)}~$${S.cloud_top.toFixed(0)})</p>
  </div>
  <div class="card">
    <h2>위험도 <span class="chip ${lvl}">${R.level}</span></h2>
    <div class="note">QQQ 20일 변동성 <b class="num" style="color:var(--ink)">${(R.vol20*100).toFixed(1)}%</b></div>
    <div class="gtrack" role="img" aria-label="변동성 ${(R.vol20*100).toFixed(1)}%"><span class="gpin" style="left:${pin}%"></span></div>
    <div class="gscale num"><span>0</span><span style="left:45%">18</span><span style="left:62.5%">25</span><span>40%</span></div>
    <div class="stats">
      <div class="stat"><div class="k">VIX</div><div class="v num">${R.vix!=null?R.vix.toFixed(1):'–'}</div></div>
      <div class="stat"><div class="k">QQQ 고점 대비</div><div class="v num ${cls(R.q_dd52)}">${sgn(R.q_dd52)}</div></div>
      <div class="stat"><div class="k">TQQQ 고점 대비</div><div class="v num ${cls(R.tq_dd52)}">${sgn(R.tq_dd52)}</div></div>
    </div>
    <p class="note">52주 고점 QQQ $${R.q_hi52.toFixed(2)}(${md(R.q_hi52_date)}) · TQQQ $${R.tq_hi52.toFixed(2)}(${md(R.tq_hi52_date)}) · TQQQ 하루 보통 움직임 ±${(R.tq_move1d*100).toFixed(1)}%${R.term!=null?` · VIX 기간구조 ${R.term.toFixed(2)} ${R.term<1?'(역전: 단기 공포 큼)':'정상'}`:''}</p>
  </div>
  <div class="card">
    <h2>모의계좌 <small>시작 이후 수익률 (달러 기준)</small></h2>
    <div id="eqChart"></div>
    <div class="legend" id="eqLegend"></div>
    <div class="tw"><table><thead><tr><th>계좌</th><th>수익률</th><th>지금 비중</th><th>다음 목표</th></tr></thead><tbody id="eqTable"></tbody></table></div>
    <p class="note">매일 종가로 목표 비중을 미리 기록하고 다음 거래일 시가에 체결한 가상 계좌예요. OP_실전은 실제 운용 규칙, 나머지는 비교용 연구 계좌예요.</p>
  </div>
  <div class="card">
    <h2>헤지 고려 구간 <span class="chip ${D.hedge.on?'warn':'plain'}">${D.hedge.on?'예':'아니오'}</span></h2>
    <p class="note">${D.hedge.on?esc(D.hedge.flags.join(', '))+' · ':''}변동성 높음, 청산선까지 2% 미만, 1주 뉴스 내림 60점 이상이면서 오름보다 20점 이상 높음 중 하나라도 해당하면 "예"가 돼요.</p>
  </div>
  <div class="foot">매일 운영 자동 실행이 끝나면 새 자료로 바뀌어요</div>
</section>`;
}

/* 차트·뉴스 점수 한눈에: 레퍼런스의 8조각 원을 세로로 반 나눠 왼쪽 = 차트 분석(기술적 점수), 오른쪽 = 뉴스 점수.
   반쪽마다 위에서 아래로 QQQ 오름 · TQQQ 오름 · TQQQ 내림 · QQQ 내림 (좌우가 거울처럼 같은 항목). 안쪽 밝은 조각 길이 = 점수 */
const ROSE_P=[['QQQ','up'],['TQQQ','up'],['TQQQ','down'],['QQQ','down']];
function roseCard(D){
  const N=D.news||{};
  if(!N.scores||!D.charts.QQQ.scores)return '';
  let cur=store('sd-rose'); if(!PER[cur])cur='w1';
  return `<div class="card rose" id="rose">
    <h2>차트 · 뉴스 점수 한눈에 <small>0~100 근거 강도 · 확률 아님</small></h2>
    <div id="roseSeg">${seg(Object.entries(PER),cur,'data-h')}</div>
    <div id="roseSvg"></div>
    <div class="rv" id="roseV"></div>
    <p class="note" id="roseNote"></p>
    <div class="rgo"><button type="button" data-go="t-chart">차트 점수 자세히</button><button type="button" data-go="t-news">뉴스 점수 자세히</button></div>
  </div>`;
}
function petalPath(a0,a1,ro,c,edge){
  // a0→a1: 위(12시)에서 시계 방향 각도(라디안). ro = 보이는 바깥 반지름. 모서리 반지름 c는 같은 색 두꺼운 테두리(2c)로 만든다.
  // edge = 옆 변을 중심선에서 띄우는 거리(틈의 절반 + 안쪽 여백). 경로는 그만큼 + c 안으로 들여 그린다.
  const d=edge+c,half=(a1-a0)/2,mid=(a0+a1)/2,apex=d/Math.sin(half),R=ro-c;
  const P=(r,a)=>`${(r*Math.sin(a)).toFixed(2)} ${(-r*Math.cos(a)).toFixed(2)}`;
  if(R<=apex+.5)return `M${P(apex+.5,mid)} L${P(apex,mid)} Z`;
  const o=r=>Math.asin(Math.min(1,d/r));
  return `M${P(R,a0+o(R))} A${R.toFixed(2)} ${R.toFixed(2)} 0 0 1 ${P(R,a1-o(R))} L${P(apex,mid)} Z`;
}
function roseSvg(T,Nw,h){
  const RO=150,G=3,CS=14,PAD=7,CI=8,step=Math.PI/4,rad=Math.PI/180;
  const minV=(G+PAD+CI)/Math.sin(step/2)+CI, maxV=RO-PAD;            // 0점·100점일 때 밝은 조각 바깥 반지름
  let shells='',fills='',labels='';
  for(const side of [-1,1]){                                          // -1 = 왼쪽(차트), 1 = 오른쪽(뉴스)
    const sc=side<0?T:Nw;
    ROSE_P.forEach(([t,k],i)=>{
      let a0=i*step,a1=(i+1)*step; if(side<0){[a0,a1]=[-a1,-a0]}
      const v=sc[t]&&sc[t][h]?sc[t][h][k]:null;
      shells+=`<path class="sh" stroke-width="${2*CS}" d="${petalPath(a0,a1,RO,CS,G)}"/>`;
      const ro=v==null?0:minV+(maxV-minV)*Math.max(0,Math.min(100,v))/100;
      if(v!=null)fills+=`<path class="${k==='up'?'pu':'pd'}" stroke-width="${2*CI}" d="${petalPath(a0,a1,ro,CI,G+PAD)}"/>`;
      const mid=(a0+a1)/2,rl=104,x=rl*Math.sin(mid),y=-rl*Math.cos(mid),on=ro>rl+12?' on':'';
      labels+=`<text class="n${on}" x="${x.toFixed(1)}" y="${(y+2).toFixed(1)}">${v==null?'–':v}</text><text class="k${on}" x="${x.toFixed(1)}" y="${(y+16).toFixed(1)}">${t} ${k==='up'?'오름':'내림'}</text>`;
    });
  }
  const say=sc=>ROSE_P.map(([t,k])=>`${t} ${k==='up'?'오름':'내림'} ${sc[t]&&sc[t][h]?sc[t][h][k]:'없음'}`).join(', ');
  return `<svg viewBox="-172 -178 344 356" role="img" aria-label="${PER[h]} 점수. 왼쪽 차트 분석: ${say(T)}. 오른쪽 뉴스 분석: ${say(Nw)}.">
    <line class="ax" x1="0" y1="-174" x2="0" y2="174"/>
    ${shells}${fills}${labels}
    <text class="side" x="-170" y="-160" style="text-anchor:start">◀ 차트 분석</text>
    <text class="side" x="170" y="-160" style="text-anchor:end">뉴스 분석 ▶</text>
    <text class="sn" x="-170" y="-145" style="text-anchor:start">기술적 지표</text>
    <text class="sn" x="170" y="-145" style="text-anchor:end">${CUMH.includes(h)?'누적 점수':'그날 뉴스'}</text>
    <text class="sn" x="-170" y="168" style="text-anchor:start">위 = 오름 · 아래 = 내림</text>
    <text class="sn" x="170" y="168" style="text-anchor:end">길수록 근거 강함</text>
  </svg>`;
}
function roseLean(s){if(!s)return null;const d=s.up-s.down;return {d,dir:Math.abs(d)<10?0:d>0?1:-1}}
function roseTxt(l){return l==null?'<span class="muted">–</span>':l.dir===0?`<span class="muted">비슷 <span class="num">${l.d>0?'+':l.d<0?'−':'±'}${Math.abs(l.d)}</span></span>`:`<span class="${l.dir>0?'up':'down'}">${l.dir>0?'오름':'내림'} 우세 <b class="num">${l.dir>0?'+':'−'}${Math.abs(l.d)}</b></span>`}
function mountRose(D){
  const root=$('rose'); if(!root)return;
  const N=D.news,T={QQQ:D.charts.QQQ.scores,TQQQ:D.charts.TQQQ.scores};
  let cur=store('sd-rose'); if(!PER[cur])cur='w1';
  function draw(){
    $('roseSvg').innerHTML=roseSvg(T,N.scores,cur);
    $('roseV').innerHTML=`<span></span><span class="h">차트 (오름−내림)</span><span class="h">뉴스 (오름−내림)</span><span></span>`+['QQQ','TQQQ'].map(t=>{
      const a=roseLean(T[t]&&T[t][cur]),b=roseLean(N.scores[t]&&N.scores[t][cur]);
      const ag=!a||!b?'':a.dir&&b.dir?(a.dir===b.dir?'<span class="chip acc">같은 방향</span>':'<span class="chip warn">엇갈림</span>'):'<span class="chip plain">한쪽만 뚜렷</span>';
      return `<span class="tk">${t}</span><span>${roseTxt(a)}</span><span>${roseTxt(b)}</span><span class="ag">${ag}</span>`}).join('');
    const nd=N.date&&N.date!==D.date?` · 뉴스는 ${md(N.date)} 수집분`:'';
    $('roseNote').textContent=`${PER[cur]} 기준. 차트 점수는 과거 검증에서 근거가 약해 참고용이에요. 뉴스 점수는 ${CUMH.includes(cur)?'1달 이상이라 누적 점수(오늘 뉴스는 조금씩만 섞음)':'그날 뉴스로 매긴 점수'}예요. 차이 10점 안쪽은 "비슷"으로 봐요${nd}.`;
  }
  const segEl=$('roseSeg');
  segEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.h;store('sd-rose',cur);
    segEl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.h===cur));draw()});
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>$(b.dataset.go).click());
  draw();
}
function paperChart(P){
  if(!P||!P.accounts)return;
  const cols={'P1_기준':'var(--muted)','P2_변동성':'var(--accent)','P3_E':'var(--warn)','OP_실전':'var(--ink)'};
  const series=Object.entries(P.accounts).map(([k,a])=>({k,pts:[[P.start||'',0]].concat(a.ret)}));
  const n=series[0].pts.length;
  const W=360,H=170,L=4,R=58,T=10,B=22;
  const all=series.flatMap(s=>s.pts.map(p=>p[1]));let lo=Math.min(...all,0),hi=Math.max(...all,0);const pd=(hi-lo)*.12||.01;lo-=pd;hi+=pd;
  const x=i=>L+i*(W-L-R)/Math.max(1,n-1), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const st=nice((hi-lo)/4);let g='';
  for(let v=Math.ceil(lo/st)*st;v<hi;v+=st){const vv=Math.abs(v)<1e-9?0:v;g+=`<line x1="${L}" x2="${W-R}" y1="${y(vv)}" y2="${y(vv)}" stroke="var(--line)" ${vv===0?'stroke-width="1.6"':''}/><text x="${L+2}" y="${y(vv)-3}" font-size="10">${vv===0?'0%':sgn(vv,0)}</text>`}
  const every=Math.ceil(n/6);
  const xl=series[0].pts.map((p,i)=>(i%every===0||i===n-1)?`<text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="middle">${i===0?'시작':md(p[0])}</text>`:'').join('');
  const ends=series.map(s=>({k:s.k,v:s.pts[n-1][1],yy:y(s.pts[n-1][1])})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<12)ends[i].yy=ends[i-1].yy+12;
  const lines=series.map(s=>`<path d="${s.pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${cols[s.k]||'var(--muted)'}" stroke-width="${s.k==='OP_실전'?2.2:1.5}" ${s.k==='P1_기준'?'stroke-dasharray="4 3"':''}/>`).join('');
  const lab=ends.map(e=>`<text x="${W-R+6}" y="${e.yy+4}" font-size="10.5" font-weight="600" style="fill:${cols[e.k]};font-family:var(--mono)">${sgn(e.v,2)}</text>`).join('');
  $('eqChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="모의계좌 수익률">${g}${xl}${lines}${lab}</svg>`;
  $('eqLegend').innerHTML=Object.entries(cols).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('');
  $('eqTable').innerHTML=Object.entries(P.accounts).map(([k,a])=>{const r=a.ret.length?a.ret[a.ret.length-1][1]:null;
    return `<tr><td>${k}</td><td class="${cls(r)}">${sgn(r,2)}</td><td>${a.weight==null?'–':Math.round(a.weight*100)+'%'}</td><td>${a.target==null?'–':Math.round(a.target*100)+'%'}</td></tr>`}).join('');
}

/* ---------------- 차트 ---------------- */
function chartTab(D){
  const card=(k)=>{const C=D.charts[k];return `<div class="card" id="c-${k}">
    <h2>${k} <small>일봉 · 지금 가격 기준</small></h2>
    ${seg([['63','3개월'],['126','6개월'],['252','1년']],store('sd-range')||'126','data-range')}
    <div class="cinfo num" id="ci-${k}"></div>
    <div class="cwrap" id="cv-${k}"></div>
    <div class="toggles" id="tg-${k}"></div>
    <div class="tl" id="tl-${k}"></div>
    <div id="mx-${k}" style="min-width:0">${maCrossTable(D.ma_cross&&D.ma_cross[k])}</div>
    <div class="chips">${sigChips(C.signals)}</div>
  </div>`};
  const q=D.charts.QQQ.scores,t=D.charts.TQQQ.scores;
  return `<section class="tab" id="chart" hidden>

const FG_KO={'extreme fear':'극단적 공포',fear:'공포',neutral:'중립',greed:'탐욕','extreme greed':'극단적 탐욕'};
const PDAYS={w1:7,m1:30,m3:91,m6:182,y1:365};
const tday=d=>Date.parse(d+'T00:00:00Z');
function pastOf(ser,per){
  const n=ser.length;if(n<2)return null;
  if(per==='d1')return n-2;
  const t=tday(ser[n-1][0])-PDAYS[per]*864e5;
  for(let k=n-1;k>=0;k--)if(tday(ser[k][0])<=t)return t-tday(ser[k][0])>10*864e5?null:k;
  return null;
}
function mpVal(m,v){return m.unit==='bp'?v.toFixed(2)+'%':m.unit==='pct'?'$'+v.toFixed(2):m.unit==='pt'?v.toFixed(0):v.toFixed(2)}
function mpChg(m,now,past){const d=now-past;const s=d>0?'+':d<0?'−':'';
  return m.unit==='bp'?s+Math.abs(d*100).toFixed(0)+'bp':m.unit==='pct'?sgn(now/past-1):m.unit==='pt'?s+Math.abs(d).toFixed(1)+'점':s+Math.abs(d).toFixed(2)}
function spark(pts){
  const W=88,H=32,P=3;const vs=pts.map(p=>p[1]);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1e-9){hi+=1;lo-=1}
  const x=i=>P+i*(W-2*P)/Math.max(1,pts.length-1),y=v=>P+(hi-v)/(hi-lo)*(H-2*P);
  const c=vs[vs.length-1]>=vs[0]?'var(--up)':'var(--down)';
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${x(0)}" cy="${y(vs[0])}" r="2" fill="var(--muted)"/><circle cx="${x(pts.length-1)}" cy="${y(vs[vs.length-1])}" r="2.6" fill="${c}"/></svg>`;
}

function shortSpark(SH,cur){
  // 선택한 기간 동안의 잔고 흐름 (그 기간 시작 = 0%)
  const days={m1:30,m3:91,m6:182,y1:365}[cur];
  const cols={QQQ:'var(--ink)',TQQQ:'var(--up)',SQQQ:'var(--down)'};
  const ser=SH.tickers.map(t=>{const end=new Date(t.date+'T00:00:00Z'),from=new Date(end-(days-7)*864e5);
    const pts=t.series.filter(p=>new Date(p[0]+'T00:00:00Z')>=from);const base=t.comp[cur]?t.comp[cur].v:pts[0]&&pts[0][1];
    const all=t.comp[cur]?[[t.comp[cur].date,t.comp[cur].v]].concat(pts.filter(p=>p[0]>t.comp[cur].date)):pts;
    return {tk:t.tk,pts:all.map(p=>[p[0],p[1]/base-1])}}).filter(s=>s.pts.length>1);
  if(!ser.length)return '';
  const W=360,H=130,L=4,R=50,T=8,B=20;
  const dates=[...new Set(ser.flatMap(s=>s.pts.map(p=>p[0])))].sort();
  const all=ser.flatMap(s=>s.pts.map(p=>p[1]));let lo=Math.min(...all,0),hi=Math.max(...all,0);const pd=(hi-lo)*.1||.05;lo-=pd;hi+=pd;
  const t0=+new Date(dates[0]),t1=+new Date(dates[dates.length-1]);
  const x=d=>L+(+new Date(d)-t0)/Math.max(1,t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let s=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1.5"/><text x="${L+2}" y="${y(0)-3}" font-size="10">0%</text>`;
  s+=`<text x="${L}" y="${H-5}" font-size="10">${md(dates[0])}</text><text x="${W-R}" y="${H-5}" font-size="10" text-anchor="end">${md(dates[dates.length-1])}</text>`;
  const ends=ser.map(z=>({tk:z.tk,v:z.pts[z.pts.length-1][1],yy:y(z.pts[z.pts.length-1][1])})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<12)ends[i].yy=ends[i-1].yy+12;
  s+=ser.map(z=>`<path d="${z.pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${cols[z.tk]}" stroke-width="1.8"/>`+z.pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2" fill="${cols[z.tk]}"/>`).join('')).join('');
  s+=ends.map(e=>`<text x="${W-R+5}" y="${e.yy+4}" font-size="10.5" font-weight="600" style="fill:${cols[e.tk]};font-family:var(--mono)">${e.tk} ${sgn(e.v,0)}</text>`).join('');
  return `<p class="sub" style="margin-top:4px">${PER[cur]} 동안 잔고 금액 흐름 <span class="note" style="font-weight:400">(공시일마다 한 점)</span></p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="공매도 잔고 흐름">${s}</svg>`;
}

function mountEvents(E){
  if(!E||!E.categories)return;
  const keys=Object.keys(E.categories).filter(k=>E.categories[k].length);
  if(!keys.length){$('evList').innerHTML='<p class="note">키워드에 걸린 이벤트가 없어요.</p>';return}
  let cur=store('sd-ev');if(!keys.includes(cur))cur=keys[0];
  const segEl=$('evSeg');segEl.innerHTML=seg(keys.map(k=>[k,`${E.names[k]||k} ${E.categories[k].length}`]),cur,'data-p');
  function draw(){
    const evs=E.categories[cur];
    $('evBop').innerHTML=cur==='election'?bopCard(evs):'';

  draw();
}

const SIMH=[['w1','1주'],['m1','1달'],['m3','3개월'],['m6','6개월'],['y1','1년']];
function rangeChart(sim,key){
  const rows=SIMH.filter(([k])=>sim.horizons[k]).map(([k,l])=>({l,p:sim.horizons[k][key]}));
  let lo=Math.min(...rows.map(r=>r.p.p5),0),hi=Math.max(...rows.map(r=>r.p.p95),0);const pd=(hi-lo)*.05;lo-=pd;hi+=pd;
  const W=360,L=100,R=40,rh=30,T=6,H=T+rows.length*rh+18,x=v=>L+(v-lo)/(hi-lo)*(W-L-R);
  let s=`<line x1="${x(0)}" x2="${x(0)}" y1="${T-2}" y2="${H-16}" stroke="var(--line)" stroke-width="1.4"/><text x="${x(0)}" y="${H-4}" font-size="10" text-anchor="middle">0%</text>`;
  rows.forEach((r,i)=>{const cy=T+i*rh+rh/2,p=r.p;
    s+=`<text x="0" y="${cy+4}" font-size="11.5" font-weight="600" style="fill:var(--ink)">${r.l}</text><text x="34" y="${cy+4}" font-size="10" style="font-family:var(--mono)">${sgn(p.p50,0)}</text>
    <line x1="${x(p.p5)}" x2="${x(p.p95)}" y1="${cy}" y2="${cy}" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="${x(p.p5)}" y="${cy-5}" width="${Math.max(0,x(p.p25)-x(p.p5))}" height="10" fill="var(--down)" fill-opacity=".22"/>
    <rect x="${x(p.p75)}" y="${cy-5}" width="${Math.max(0,x(p.p95)-x(p.p75))}" height="10" fill="var(--up)" fill-opacity=".22"/>
    <rect x="${x(p.p25)}" y="${cy-7}" width="${Math.max(0,x(p.p75)-x(p.p25))}" height="14" rx="2" fill="var(--accent)" fill-opacity=".55"/>
    <line x1="${x(p.p50)}" x2="${x(p.p50)}" y1="${cy-9}" y2="${cy+9}" stroke="var(--ink)" stroke-width="2"/>
    <text x="${x(p.p5)-4}" y="${cy+3.5}" font-size="10" text-anchor="end" style="fill:var(--down);font-family:var(--mono)">${sgn(p.p5,0)}</text>
    <text x="${x(p.p95)+4}" y="${cy+3.5}" font-size="10" style="fill:var(--up);font-family:var(--mono)">${sgn(p.p95,0)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시뮬레이션 수익률 범위">${s}</svg>`;
}

    <p class="note">QQQ ${esc(desc)}였던 날 이후 실제로 어떻게 됐는지 센 결과예요. 10거래일 안에 겹치는 날은 한 번으로 셌고, TQQQ는 2010년 상장 이후만 셌어요.</p>
    <div class="tw"><table><thead><tr><th>기간</th><th>QQQ 오른 비율</th><th>QQQ 가운데</th><th>TQQQ 오른 비율</th><th>TQQQ 가운데</th><th>TQQQ 나쁜 10%</th></tr></thead>
    <tbody>${SIMH.filter(([k])=>an.horizons[k]).map(([k,l])=>{const h=an.horizons[k];return `<tr><td>${l}</td><td>${pc0(h.q_up)} <span class="muted" style="font-size:11px">${h.q_n??an.episodes}번</span></td><td class="${cls(h.q_median)}">${sgn(h.q_median)}</td><td>${pc0(h.tq_up)} <span class="muted" style="font-size:11px">${h.tq_n}번</span></td><td class="${cls(h.tq_median)}">${sgn(h.tq_median)}</td><td class="${cls(h.tq_p10)}">${sgn(h.tq_p10,0)}</td></tr>`}).join('')}</tbody></table></div>
    <p class="note">6개월·1년은 그 뒤 결과가 나온 날만 세서 횟수가 조금 적어요.</p>
  </div>
</section>`;
}
</script>
</body>
</html>
