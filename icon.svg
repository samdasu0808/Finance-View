    <circle cx="214" cy="-6" r="11" fill="#FF5E63"/>
  </g>
  <line x1="150" y1="306" x2="362" y2="306" stroke="#E6ECEF" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="388" text-anchor="middle" font-family="Inter Display" font-weight="800" font-size="92" letter-spacing="10" fill="#F2F6F8">FINC</text>
