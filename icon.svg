<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16242D"/><stop offset="1" stop-color="#0A1116"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".2" r=".7">
      <stop offset="0" stop-color="#43B9C2" stop-opacity=".28"/><stop offset="1" stop-color="#43B9C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0B7A84"/><stop offset="1" stop-color="#5FD3DB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- 오르는 막대 세 개 -->
  <g transform="translate(160 120)">
